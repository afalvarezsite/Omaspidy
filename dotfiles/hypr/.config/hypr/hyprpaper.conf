# hyprpaper.conf
# Configuración simplificada y de alta compatibilidad para Omaspidy

preload = /home/adri/.config/hypr/wallpaper.jpg

# Bloques de fondo de pantalla para eDP-1 y fallback universal (Sintaxis Hyprpaper >= v0.8.0)
wallpaper {
    monitor = eDP-1
    path = /home/adri/.config/hypr/wallpaper.jpg
    fit_mode = cover
}

wallpaper {
    monitor = 
    path = /home/adri/.config/hypr/wallpaper.jpg
    fit_mode = cover
}

# Mantener IPC habilitado para depuración y control dinámico
ipc = on

# Ocultar el mensaje splash
splash = false
