# input.conf
# Configuración de teclado, ratón y touchpad
# Valores sincronizados con el hardware real: HTIX5288:00 0911:5288 Touchpad

input {
    kb_layout = es
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    # Sensibilidad del puntero (-1.0 a 1.0)
    # 0.4 configurado explícitamente (hyprctl confirma set: true)
    sensitivity = 0.4

    # Comportamiento del foco
    follow_mouse = 1
    mouse_refocus = true

    touchpad {
        # El driver libinput del HTIX5288 ya reporta scroll_factor = -1.0
        # (scroll invertido a nivel de hardware), por lo que natural_scroll = false
        # produce el comportamiento correcto de "deslizar contenido hacia abajo = scroll abajo"
        natural_scroll = false

        # Activar tapping y arrastre (confirmado por libinput como comportamiento por defecto)
        tap-to-click = true
        tap-and-drag = true

        # Desactivar mientras se escribe para evitar toques accidentales
        disable_while_typing = true

        # drag_lock desactivado: soltar el dedo termina el arrastre
        drag_lock = false

        # Emulación de botón central desactivada (no compatible con este touchpad)
        middle_button_emulation = false

        # Clickfinger desactivado: usar zonas físicas L/R del touchpad
        clickfinger_behavior = false

        # Factor de velocidad de scroll (valor nativo del sistema)
        scroll_factor = 1.0
    }
}

gestures {
    # Nuevo framework de gestos (Hyprland >= 0.51)
    # Deslizar horizontalmente con 3 dedos para cambiar de workspace
    gesture = 3, horizontal, workspace
}

