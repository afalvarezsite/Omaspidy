background {
    monitor =
    path = screenshot
    color = rgba(10, 10, 10, 0.95) 
    blur_passes = 4 
    blur_size = 4
}

# Reloj principal (Blanco puro con sombra roja aracnida)
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 130
    font_family = Hack Nerd Font
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(220, 20, 60, 0.9)
}

# Frase tematica (Rojo)
label {
    monitor =
    text = WITH GREAT POWER COMES GREAT RESPONSIBILITY
    color = rgba(220, 20, 60, 1.0)
    font_size = 14
    font_family = Hack Nerd Font
    position = 0, 20
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 1.0)
}

# Campo de contrasena (Borde rojo, fondo negro, texto blanco)
input-field {
    monitor =
    size = 320, 60
    outline_thickness = 4
    dots_size = 0.3
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(220, 20, 60, 1.0)
    inner_color = rgba(10, 10, 10, 0.9)
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = false
    font_family = Hack Nerd Font
    placeholder_text = <span foreground="##ffffff">Web-Shooters Locked...</span>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
    check_color = rgba(255, 255, 255, 1.0)
    fail_color = rgba(150, 0, 0, 1.0)
    fail_text = <i>ACCESS DENIED</i>
}
