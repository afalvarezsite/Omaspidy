# visual.conf
# Configuración visual: general, decoración y animaciones
# Extraído de hyprland.conf para modularidad completa

general {
    gaps_in = 4
    gaps_out = 12
    border_size = 2
    # Gradiente dinámico de bordes basado en el tema activo
    col.active_border = $color_primary $color_bg_dark $color_primary_glow $color_bg_light 45deg
    col.inactive_border = $color_inactive
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 0.96
    inactive_opacity = 0.88
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        xray = true
        vibrancy = 0.1696
    }
    shadow {
        enabled = true
        range = 15
        render_power = 4
        color = rgba(ff003344)
        color_inactive = rgba(00000066)
    }
}

animations {
    enabled = true

    # ==========================================
    # 📐 Curvas Bézier Premium (Unixporn Standards)
    # ==========================================
    bezier = fluid_decel, 0.1, 1.0, 0, 1.0      # Estilo iOS / Fluent Design (desaceleración majestuosa)
    bezier = md3_decel, 0.05, 0.7, 0.1, 1.0     # Material Design 3 (suave y natural)
    bezier = md3_accel, 0.3, 0.0, 0.8, 0.15     # Aceleración rápida para salidas limpias
    bezier = overshot, 0.05, 0.9, 0.1, 1.05     # Rebote sutil y elegante en punto final
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92    # Rebote elástico juguetón (estilo anime/gaming)
    bezier = menu_decel, 0.1, 1.0, 0, 1.0       # Curva instantánea y limpia para menús
    bezier = menu_accel, 0.38, 0.04, 1.0, 0.07  # Salida veloz para menús
    bezier = easeOutQuint, 0.23, 1.0, 0.32, 1.0 # Desaceleración clásica de 5º grado
    bezier = easeOutExpo, 0.16, 1.0, 0.3, 1.0   # Desaceleración exponencial para desvanecimientos
    bezier = linear, 0.0, 0.0, 1.0, 1.0         # Velocidad uniforme para rotaciones continuas

    # ==========================================
    # 🌟 PRESET ACTIVO: FLUID MODERN (Predeterminado de Omaspidy)
    # ==========================================
    # --- Animaciones Globales y Ventanas (Sensación de Continuidad y Desplazamiento) ---
    animation = global, 1, 3.5, md3_decel
    animation = windows, 1, 3.4, fluid_decel, slide         # Las ventanas se desplazan con inercia física suave
    animation = windowsIn, 1, 3.2, fluid_decel, slide       # Entrada deslizando desde el borde más cercano
    animation = windowsOut, 1, 3.0, md3_accel, slide        # Salida deslizando suavemente hacia fuera del escritorio
    animation = windowsMove, 1, 3.4, fluid_decel, slide     # Movimiento/Redimensionamiento entre posiciones

    # --- Desvanecimientos (Fade) ---
    animation = fade, 1, 2.8, easeOutExpo
    animation = fadeIn, 1, 2.2, easeOutExpo
    animation = fadeOut, 1, 2.2, easeOutExpo

    # --- Espacios de Trabajo (Workspaces - Efecto Carrusel/Continuo) ---
    animation = workspaces, 1, 5.0, fluid_decel, slide      # Deslizamiento continuo que empuja la ventana anterior
    animation = workspacesIn, 1, 5.0, fluid_decel, slide    # Entrada fluida de la nueva área
    animation = workspacesOut, 1, 4.8, fluid_decel, slide   # Salida empujada de la antigua área

    # --- Bordes y Efectos ---
    animation = border, 1, 4.0, easeOutQuint
    animation = borderangle, 1, 100, linear, loop # Rotación lenta y sofisticada del gradiente

    # --- Capas del Sistema (Layer Rules para Waybar, Mako, Anyrun) ---
    animation = layers, 1, 3.0, menu_decel, slide
    animation = layersIn, 1, 3.0, menu_decel, slide
    animation = layersOut, 1, 2.2, menu_accel, slide
    animation = fadeLayers, 1, 3.0, menu_decel
    animation = fadeLayersIn, 1, 2.5, menu_decel
    animation = fadeLayersOut, 1, 2.0, menu_accel

    # ==========================================
    # ⚡ PRESET OPCIONAL 1: SNAPPY / ULTRA-FAST (Descomentar para usar)
    # ==========================================
    # animation = global, 1, 2.5, md3_decel
    # animation = windows, 1, 2.2, md3_decel, popin 85%
    # animation = windowsIn, 1, 2.0, md3_decel, popin 85%
    # animation = windowsOut, 1, 1.8, md3_accel, popin 88%
    # animation = windowsMove, 1, 2.2, fluid_decel, slide
    # animation = fade, 1, 2.0, easeOutExpo
    # animation = workspaces, 1, 3.0, fluid_decel, slide
    # animation = border, 1, 2.5, easeOutQuint
    # animation = borderangle, 1, 80, linear, loop
    # animation = layers, 1, 2.2, menu_decel, slide

    # ==========================================
    # 🚀 PRESET OPCIONAL 2: DYNAMIC / OVERSHOT (Descomentar para usar)
    # ==========================================
    # animation = global, 1, 3.8, overshot
    # animation = windows, 1, 3.5, overshot, popin 80%
    # animation = windowsIn, 1, 3.2, overshot, popin 80%
    # animation = windowsOut, 1, 2.8, md3_accel, popin 82%
    # animation = windowsMove, 1, 3.5, overshot, slide
    # animation = fade, 1, 3.0, easeOutExpo
    # animation = workspaces, 1, 4.5, overshot, slidefade 25%
    # animation = border, 1, 5.0, easeOutQuint
    # animation = borderangle, 1, 120, linear, loop
    # animation = layers, 1, 3.2, overshot, slide
}

dwindle {
    preserve_split = true
}
