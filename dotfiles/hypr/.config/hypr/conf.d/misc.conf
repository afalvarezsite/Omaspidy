
# misc.conf
# Configuración miscelánea: comportamiento general de Hyprland

misc {
    # Deshabilitar el logo y la animación de splash de Hyprland
    disable_hyprland_logo = true
    disable_splash_rendering = true

    # Despertar la pantalla al mover el ratón (útil con hypridle)
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true



    # Forzar el renderizado de ventanas en el fondo de la pila al frente al enfocarlas
    focus_on_activate = false

    # Permitir que las aplicaciones soliciten ser enfocadas (sin robar el foco automáticamente)
    allow_session_lock_restore = true

    # Animación del cursor al arrastrar ventanas
    animate_manual_resizes = false
    animate_mouse_windowdragging = false

    # Habilitar el swallowing (la terminal que lanza una app gráfica puede ocultarse)
    enable_swallow = true
    swallow_regex = ^(Alacritty|alacritty)$
}
