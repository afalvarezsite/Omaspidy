# ============================================================================
# MPV OPTIMIZED CONFIGURATION (Wayland/Hyprland)
# Premium, ultra-stable, smooth video playback settings
# ============================================================================

# Salida de vídeo para Wayland moderna
vo=gpu
gpu-context=wayland

# Decodificación por hardware estable y segura
hwdec=auto-safe

# Forzar sincronización con el refresco de pantalla para evitar tearing
video-sync=display-resample

# Salida de audio a través de PipeWire/PulseAudio
ao=pulse

# Guardar posición al salir
save-position-on-quit=yes

# Mostrar controles OSC con interfaz premium
osc=yes
