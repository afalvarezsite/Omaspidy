# config
# Configuración del demonio de notificaciones Mako - Spider-Man Classic

font=Hack Nerd Font 10
background-color=#0c0d12
text-color=#f8f9fa
border-color=#ff1e43
border-size=2
border-radius=8
padding=15
margin=10
default-timeout=5000

[urgency=low]
border-color=#0066ff

[urgency=high]
border-color=#e60026
default-timeout=0

[mode=dnd]
invisible=1
