# rules.conf
# Reglas de ventanas y espacios de trabajo actualizadas para Hyprland v0.55+

# -- Window Rules --

# Clipse (Portapapeles normal) debe flotar en el centro de la pantalla
windowrule = float 1, match:class clipse
windowrule = size 622 652, match:class clipse
windowrule = center 1, match:class clipse

# Scratchpad General (Terminal flotante on-demand)
windowrule = float 1, match:class ^(scratchpad_term)$
windowrule = size 85% 80%, match:class ^(scratchpad_term)$
windowrule = center 1, match:class ^(scratchpad_term)$
windowrule = dim_around 1, match:class ^(scratchpad_term)$
windowrule = workspace special:scratchpad silent, match:class ^(scratchpad_term)$

# Clipse Scratchpad (Portapapeles flotante on-demand)
windowrule = float 1, match:class ^(clipse_scratchpad)$
windowrule = size 622 652, match:class ^(clipse_scratchpad)$
windowrule = center 1, match:class ^(clipse_scratchpad)$
windowrule = dim_around 1, match:class ^(clipse_scratchpad)$
windowrule = workspace special:clipse_space silent, match:class ^(clipse_scratchpad)$

# Aplicaciones TUI Generales (btop, nmtui, pulsemixer, yazi, etc.)
windowrule = float 1, match:class ^(floating_tui)$
windowrule = center 1, match:class ^(floating_tui)$
windowrule = size 70% 70%, match:class ^(floating_tui)$
windowrule = dim_around 1, match:class ^(floating_tui)$

# Polkit y cuadros de diálogo
windowrule = float 1, match:class ^(.*polkit.*)$
windowrule = float 1, match:title ^(Open File|Save File|Abrir Archivo|Guardar Archivo)$

# Picture-in-Picture
windowrule = float 1, match:title ^(Picture-in-Picture)$
windowrule = pin 1, match:title ^(Picture-in-Picture)$

# Evitar maximización forzada en ciertas apps
windowrule = suppress_event maximize, match:class .*

# -- Layer Rules (Efectos de Capa) --
# Efecto blur y transparencia correcta para el lanzador Anyrun
layerrule {
    match:namespace = anyrun
    blur = on
    ignore_zero = on
}



