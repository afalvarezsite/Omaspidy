# hyprland.conf
# Archivo de configuración principal de Hyprland
# Actúa como índice que carga todos los módulos de conf.d/

# -- Tema Activo (Variables de Color Centralizadas) --
source = ~/.config/theme/active.conf

# Definir la ruta base para facilitar la carga
$confDir = ~/.config/hypr/conf.d

# -- Monitores --
source = $confDir/monitors.conf

# -- Autostart --
source = $confDir/autostart.conf

# -- Entorno --
source = $confDir/env.conf

# -- Visual (General, Decoración, Animaciones) --
source = $confDir/visual.conf

# -- Input (Teclado, Ratón, Touchpad, Gestos) --
source = $confDir/input.conf

# -- Misc (Comportamiento General) --
source = $confDir/misc.conf

# -- Reglas de Ventanas --
source = $confDir/rules.conf

# -- Atajos de Teclado --
source = $confDir/keybinds.conf

