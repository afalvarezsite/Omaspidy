# visual.conf
# Configuración visual: general, decoración y animaciones
# Extraído de hyprland.conf para modularidad completa

general {
    gaps_in = 4
    gaps_out = 12
    border_size = 2
    # Gradiente dinámico de bordes basado en el tema activo
    col.active_border = $color_primary $color_bg_dark $color_primary_glow $color_bg_light 45deg
    col.inactive_border = $color_inactive
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 0.96
    inactive_opacity = 0.88
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        xray = true
        vibrancy = 0.1696
    }
    shadow {
        enabled = true
        range = 15
        render_power = 4
        color = rgba(ff003344)
        color_inactive = rgba(00000066)
    }
}

animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.0
    bezier = winIn, 0.05, 0.95, 0.0, 1.0
    bezier = winOut, 0.2, 0.0, 0.0, 1.0
    bezier = smoothDecel, 0.1, 0.95, 0.15, 1.0
    bezier = snappy, 0.05, 1.0, 0.0, 1.0
    bezier = easeOutExpo, 0.16, 1.0, 0.3, 1.0
    bezier = easeOutQuint, 0.23, 1.0, 0.32, 1.0

    animation = global, 1, 4, snappy
    animation = windows, 1, 3.5, smoothDecel, slide
    animation = windowsIn, 1, 3.0, winIn, popin 75%
    animation = windowsOut, 1, 2.5, winOut, popin 85%
    animation = windowsMove, 1, 3.5, smoothDecel, slide
    animation = border, 1, 4, easeOutQuint
    animation = borderangle, 0
    animation = fade, 1, 3.0, easeOutExpo
    animation = fadeIn, 1, 2.5, easeOutExpo
    animation = fadeOut, 1, 2.5, easeOutExpo
    animation = workspaces, 1, 3.8, easeOutExpo, slidefade 20%
    animation = workspacesIn, 1, 3.8, easeOutExpo, slidefade 20%
    animation = workspacesOut, 1, 3.5, easeOutExpo, slidefade 20%
}

dwindle {
    preserve_split = true
}
