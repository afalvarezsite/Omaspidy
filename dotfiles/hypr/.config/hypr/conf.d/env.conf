# env.conf
# Variables de entorno Wayland, QT y GTK

# XDG Especificaciones
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Qt Variables
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct

# Tema del cursor y tamaño por defecto
env = XCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Rendimiento / Intel Arc y Aceleracion por Hardware
# Fuerzan el uso del hardware de codificacion/decodificacion de Intel (intel-media-driver)
env = LIBVA_DRIVER_NAME,iHD
env = VDPAU_DRIVER,va_gl
env = MESA_GL_VERSION_OVERRIDE,4.6
