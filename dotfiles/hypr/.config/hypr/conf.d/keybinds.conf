# keybinds.conf
# Atajos de teclado principales

# Definir la tecla Modificadora (Super/Windows)
$mainMod = SUPER

# Variables de aplicaciones por defecto
$terminal = alacritty
$fileManager = alacritty --class floating_tui -e yazi
$menu = anyrun

# Lanzadores Principales
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Space, exec, $menu

# Herramientas TUI (Flotantes y Centradas)
bind = $mainMod, B, exec, $terminal --class floating_tui -e bluetuith
bind = $mainMod, N, exec, $terminal --class floating_tui -e nmtui
bind = $mainMod, A, exec, $terminal --class floating_tui -e pulsemixer
bind = $mainMod SHIFT, A, exec, $terminal --class floating_tui -e sys-aliases
bind = $mainMod SHIFT, Escape, exec, $terminal --class floating_tui -e btop
bind = $mainMod, K, exec, $terminal --class floating_tui -e hypr-keys

# Gestión de ventanas
bind = $mainMod, Q, killactive, 
bind = $mainMod, M, exec, $terminal --class floating_tui -e sys-power
bind = $mainMod, V, togglefloating, 
bind = $mainMod, F, fullscreen, 

# Utilidades (Clipboard Manager)
bind = $mainMod, C, exec, $terminal --class clipse -e clipse

# Capturas de pantalla (Grim + Slurp + Satty)
# Usando Slurp con el tema Spider-Man (Fondo oscuro translúcido, borde rojo brillante)
bind = , Print, exec, grim -g "$(slurp -b 0c0d1280 -c ff1e43ff -s 00000000 -w 2)" - | satty --filename - --fullscreen --output-filename ~/Imágenes/Screenshots/satty-$(date '+%Y%m%d-%H%M%S').png
bind = SHIFT, Print, exec, grim - | satty --filename - --fullscreen --output-filename ~/Imágenes/Screenshots/satty-$(date '+%Y%m%d-%H%M%S').png

# Grabación de Pantalla Zero-Latency (gpu-screen-recorder con Intel VA-API)
# Graba directamente todo el monitor principal junto con el audio por defecto del sistema
bind = $mainMod ALT, R, exec, pkill -x gpu-screen-recorder || gpu-screen-recorder -w screen -f 60 -c mp4 -o ~/Vídeos/Recording_$(date +%F_%T).mp4

# Control de Multimedia y OSD (SwayOSD / brightnessctl)
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Foco de Ventanas (Vim keys o Flechas)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Espacios de Trabajo (1-9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Mover Ventana a Espacio de Trabajo
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Scroll de ratón para cambiar workspace
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mover / Redimensionar ventanas con el ratón
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
